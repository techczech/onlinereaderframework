<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="642" viewBox="0 0 1000 642" role="img" aria-label="Journey storyboard · proposed states"><rect width="100%" height="100%" fill="#faf9f5"/><g fill="#24354a" font-family="Arial,sans-serif"><text x="28" y="32" font-size="22" font-weight="700">Journey storyboard · proposed states</text><text x="28" y="65" font-size="20" font-weight="700">1  CONTENTS → CHAPTER TOP → LOCAL HEADING</text><text x="28" y="100" font-size="18" font-weight="400">▾ Parts of speech  →  Nouns  →  In Nouns: Kdo? Co? - Nominative</text><text x="28" y="135" font-size="18" font-weight="400">Nouns opens at its title. Choosing the case moves to its heading.</text><text x="28" y="170" font-size="27" font-weight="700">Kdo? Co? - Nominative - 1. pád - 1st case</text><text x="28" y="214" font-size="23" font-weight="700">Function</text><text x="28" y="258" font-size="18" font-weight="400">Words in this case most often function as the subject of a sentence.</text><text x="28" y="293" font-size="23" font-weight="700">Form</text><text x="28" y="337" font-size="18" font-weight="400">The case heading and its local headings remain distinct at larger text sizes.</text><text x="28" y="372" font-size="20" font-weight="700">2  PHONE TABLE → FULL WIDTH → RETURN TO READING</text><text x="28" y="407" font-size="18" font-weight="400">[Table]  [Collapse]  [Full width]   →   complete scrollable table</text><text x="28" y="442" font-size="18" font-weight="400">Collapse → [Show table]     Full width close → focus returns to trigger</text><text x="28" y="477" font-size="20" font-weight="700">3  BROWSE → NO MATCHES → RESET</text><text x="28" y="512" font-size="18" font-weight="400">[Find in this table: zzž] [Clear search]     0 of 6 rows</text><text x="28" y="547" font-size="18" font-weight="400">No matching rows. [Clear search] [Reset table] [Return to source]</text><text x="28" y="582" font-size="18" font-weight="400">Reset restores all 6 rows, source order, all columns and original axes.</text></g></svg>